name: Supabase Keep-Alive Health Ping

on:
  schedule:
    # Run at 12:00 UTC every 3 days to keep the Supabase free project active
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Pairly Health Endpoint
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "::error::SITE_URL repository secret is not set! Please add SITE_URL in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Pinging health endpoint at ${{ secrets.SITE_URL }}/api/health..."
          RESPONSE=$(curl -fsS -m 30 "${{ secrets.SITE_URL }}/api/health")
          echo "Health check response: $RESPONSE"
